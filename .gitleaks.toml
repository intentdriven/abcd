# gitleaks configuration for abcd-cli.
#
# Keeps the full default rule set (every real secret is still caught) and adds
# one narrow allowlist: the native secret/PII scanner's own unit-test files (the
# seal's byte-length and identity-span tests included) necessarily embed
# realistic *fake* secrets — a GitHub-PAT-shaped token, an AWS-key-shaped token,
# a session-key-shaped value — to prove the scanner detects them. These fixtures
# are the test's whole point; they are not live credentials. The allowlist is
# scoped to exactly those three files by path, so a real secret committed
# anywhere else (including other test files) still fails the scan.

title = "abcd-cli gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "abcd secret-scanner test fixtures (intentional fake secrets, not live credentials)"
paths = [
  '''internal/adapter/scanner/scanner_test\.go''',
  '''internal/adapter/scanner/identity_span_test\.go''',
  '''internal/core/launch/dryrun_test\.go''',
]
# A consistency finding key (itd-2609291923559186) is `cfk-` and sixteen hex
# digits: a deterministic SHA-256 content hash of a finding's class and ends,
# written into every issue the consistency pass files as `finding_key:`. It is
# not a credential, and generic-api-key reads it as one. The regex is matched
# against the secret alone and anchored, so a longer secret that merely starts
# with a key's shape is still caught.
regexes = [
  '''^cfk-[0-9a-f]{16}$''',
]
