name: attribution

# Fails a pull request whose commits or body break abcd's AI-attribution
# convention: the kernel trailer `Assisted-by: Claude:<model-version>`, never
# `Co-Authored-By:` for an AI, never a tool's own "Generated with <tool>" footer
# (AGENTS.md § Attribution and acknowledgements, CONTRIBUTING.md).
#
# It also refuses a LIVE AGENT-SESSION URL in any commit message in the range or
# in the pull-request body. That half was gated NOWHERE until it was added — not
# here, not in a hook, not in Go — and one reached three commit messages and two
# pull-request bodies of a managed public repo (iss-2609061438431625). It is the
# only half that is not a regex: `abcd lint outbound` judges it, because the
# opacity classifier that separates a real session id from a documentation slug is
# a conjunction POSIX ERE cannot express.
#
# WHY A GATE AND NOT PROSE: the convention has been written down since the
# beginning and drifted anyway — itd-91 records a reconciliation sweep across 78
# pull requests after PR bodies picked up a tool's default footer, and it drifted
# again on PR #212/#215. The commit half rarely slips, because a contributor
# writes it from AGENTS.md habit; the BODY half slips constantly, because it comes
# from a tool default that nothing was looking at. itd-91 owns the general version
# (a per-repo declared preference every surface reads); this enforces abcd's own
# answer meanwhile.
#
# `edited` is in the trigger list deliberately: without it, a body that passed at
# open can be edited afterwards and the gate never re-runs. It is a separate
# workflow rather than a job in ci.yml precisely so a body edit re-runs THIS and
# not the two-platform build matrix.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # Merge-queue entries re-run the required checks on the would-be merge result,
  # so this workflow must trigger there for the check to report at all. The
  # PR-data steps exempt themselves loudly below: entry to the queue already
  # required the pull_request-level run green, and a merge_group event carries
  # no PR body or head/base pair to validate.
  merge_group:

concurrency:
  # A merge_group event has no PR number; run_id keeps each queue entry in its
  # own group rather than all of them sharing (and cancelling) one empty key.
  group: attribution-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  attribution:
    # Exemptions live INSIDE the steps, deliberately, and not as a job-level `if:`.
    # A required status check that never reports leaves a pull request stuck on
    # "Expected — waiting for status" forever, and whether a job skipped by an `if:`
    # emits a check run with conclusion "skipped" is not a property worth betting a
    # pull request's mergeability on. Running the job unconditionally means the check
    # ALWAYS reports, so this workflow is safe to add to the required checks
    # (iss-212).
    #
    # The COMMIT half no longer exempts a bot, and that is the point of the change
    # rather than a side effect (iss-2609082001204831). The old reasoning — a bot
    # cannot write a trailer, so red would train a maintainer to discount red — is
    # about the MESSAGE, which the body half still exempts. It says nothing about
    # AUTHORSHIP, and authorship is what the gate is now enforcing: a commit is
    # authored by a human, machine assistance is disclosed by the trailer alone. So
    # a dependabot pull request is now red until a human lands the bump, which is
    # the correct answer rather than a cost, and the gate is not made to lie in
    # order to keep a bot's pull request green.
    # 10 rather than 5: the job now compiles the outbound checker from source, and
    # the corpus compiles it again to prove a bare checkout can. A required check
    # that goes red on a cold module cache is a false red on every pull request.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the commit half walks base..head, and the default shallow
      # checkout would not contain the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Go is here because the gate's SESSION-URL half is not a regex: it is
      # `abcd lint outbound` reading the scanner's canonical pattern set and its
      # opacity classifier, which POSIX ERE cannot express (see
      # scripts/check-attribution.sh). The footer half stays pure shell.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the only place the toolchain is written, here as everywhere
          # else in this repository (iss-2609090951291799).
          go-version-file: go.mod

      # Built ONCE, from THIS checkout, and handed to the script — which otherwise
      # falls back to `go run` and pays ~0.3s per artefact across the commit range
      # and the 94-case corpus.
      #
      # From the checkout and never from PATH or a plugin root: in this repository
      # a released binary is by construction older than the thing under test, so a
      # verb or refusal added since the last cut is unknown to it and the failure
      # is a plausible wrong answer rather than an error (AGENTS.md § Build, test,
      # and checks). RUNNER_TEMP is not on PATH, and nothing else resolves it.
      - name: Build the outbound checker from this checkout
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/abcd" ./cmd/abcd

      # The body is attacker-controlled text, so it reaches the shell ONLY as an
      # environment variable. Interpolating ${{ github.event.pull_request.body }}
      # directly into a run: block would splice that text into the script the runner
      # executes — the classic template-injection hole. `printf '%s' "$PR_BODY"` is
      # an ordinary variable expansion and is never re-scanned for substitutions.
      # The exemption is announced rather than silent: a step that no-ops must say
      # so, or a green tick reads as "the body was checked and passed" when nothing
      # was checked at all.
      - name: Check the pull-request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          EVENT_NAME: ${{ github.event_name }}
          ABCD_OUTBOUND_BIN: ${{ runner.temp }}/abcd
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "attribution: merge-queue run — body check exempt (validated on the pull request before queueing), nothing was checked."
            exit 0
          fi
          if [ "$PR_AUTHOR_TYPE" = "Bot" ]; then
            echo "attribution: pull request authored by a bot — body check exempt, nothing was checked."
            exit 0
          fi
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          bash scripts/check-attribution.sh body "$RUNNER_TEMP/pr-body.md"

      # The gate's own rules are proven in CI, not only asserted. iss-214 asked for
      # this: the trailer regex must be checked against the forms actually in this
      # repository's history, because its first cut rejected the bracketed model
      # identifiers 38 commits already use.
      # The corpus builds its own checker (it must prove the build works from a bare
      # checkout), so it takes no ABCD_OUTBOUND_BIN from here.
      - name: Check the gate's own test corpus
        run: bash scripts/check-attribution-cases.sh

      - name: Check the commit trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          ABCD_OUTBOUND_BIN: ${{ runner.temp }}/abcd
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "attribution: merge-queue run — commit check exempt (validated on the pull request before queueing; the queue's own merge commit carries no trailer to check), nothing was checked."
            exit 0
          fi
          # No bot exemption here: the commit half reads AUTHORSHIP, and a machine
          # author is exactly what it now refuses (iss-2609082001204831). A bump a
          # bot proposed is landed by a human.
          bash scripts/check-attribution.sh commits "$BASE_SHA" "$HEAD_SHA"
