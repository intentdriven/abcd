name: ci

# Checks on every pull request, on every merge-queue entry, nightly on the
# default branch, and on demand. Branch work is covered by the pull_request
# trigger alone, so a PR push runs the matrix once, and the merge-queue entry
# runs the Linux gate on exactly the tree that lands. There is no push trigger:
# with the queue, every commit on the default branch is a merge result its
# queue entry already tested, so a push run repeated that run in full
# (iss-2610110938294826). The nightly run keeps the default branch itself
# checked on macOS and against what changes outside the tree (runner images, the
# advisory databases) and saves its Go build cache (see the check job). The check job
# builds, vets and tests on Linux on every event, with race-enabled internal
# tests and the `make fmt-check` format gate, record-lint, the issue-drift check,
# docs-lint and the site-render gate in that job. The macOS suite runs as shard
# jobs nightly and on demand: on a pull request and on a merge-queue entry its
# required context reports from an ubuntu runner without taking a macOS one, and
# says so (see macos-suite and check-macos). release.yml runs the same suite on
# each release cut, through the same reusable workflow, macos-suite.yml.
# Separate jobs run full-history
# secret scanning, a workflow audit, the reviews-charter and issue-resolution
# gates (RS001-RS003), dependency review, govulncheck, the smoke harness, the
# cold-reading evals, and the work-in-progress guard.
#
# The `changes` job classifies the diff, and the duplicated lanes stand down on a
# change confined to the record and the user-facing docs. Two properties make
# that safe to rely on:
#
#   - It classifies fail-closed. Only an explicit allowlist counts as inert, and
#     every other outcome — one unlisted path, a non-PR event, an empty diff, an
#     unreadable base, an aborted script, a failed classifier job — runs the full
#     matrix. Markdown and JSON outside that allowlist (commands/, agents/,
#     hooks/, .abcd/*.json, the conventions file at the repo root) carry
#     behaviour, so they are not inert.
#   - It gates jobs and steps, never the workflow triggers. Every required check
#     context still reports on every pull request; `paths:` filtering would leave
#     one permanently pending and wedge the merge.
#
# What an inert change skips is the lanes that only a source change can move:
# the race lane, the smoke harness, and the workflow audit (anything under
# .github/ is not inert, so the audit still runs on every change it could be
# auditing). The macOS suite runs on no pull request, inert or not, so the
# classifier has nothing to stand down there.
#
# What it does not skip, besides the ubuntu unit lane, is the cold-reading evals.
# Their subject is the allowlist itself — the record and the docs are the material
# the assembler includes — so an inert change is the one most able to break them.
#
# What it does not skip is the ubuntu unit lane. Tests read the live tree under
# the allowlist — lifeboat coverage and the glossary index are asserted against
# the real .abcd/development/**, and grounding thresholds against README.md — so
# a prose-only record change can genuinely turn `go test ./...` red while
# record-lint and docs-lint both pass. Skipping it would let that reach the
# default branch. Alongside it the record gates are `go run` invocations of this
# module, so a record-only change compiles most of the module either way.
on:
  pull_request:
  # Merge-queue entries run the Linux gate on the would-be merge result. The
  # changes classifier below treats any non-pull_request event as never inert,
  # so a merge_group run executes every job but the macOS suite's shards, which
  # stand down there (see macos-suite); the two below run everything.
  merge_group:
  # Nightly on the default branch, at an off-peak minute (02:41 UTC) that is
  # not the top of an hour, when scheduled runs pile up. A scheduled run carries
  # no base commit, so the range-scoped gates announce that they did not run and
  # every tree-shaped gate runs in full.
  schedule:
    - cron: "41 2 * * *"
  # By hand, on any branch: the same full run as the nightly one.
  workflow_dispatch:

# A pull request's runs share one group per ref, so a new push to it supersedes
# the run still in flight for its previous revision. Every other event's run is
# a group of its own, keyed on its run id, and is never cancelled by
# concurrency. The expressions name the one event that may be cancelled rather
# than the events that may not, so an event added later falls on the safe side.
#
# A MERGE-QUEUE run being exempt is load-bearing rather than tidy
# (iss-2609020716560392). A queue entry runs on a temporary ref,
# `refs/heads/gh-readonly-queue/main/pr-N-<base sha>`, which is never the default
# branch — so a cancel expression that excused only the default branch armed
# cancellation there, and GitHub reads a cancelled required check as a FAILED
# one: it drops the entry and disarms auto-merge with nothing said on the pull
# request. One PR was removed four times in a night this way. Both halves hold
# it:
#
#   - The cancel expression is true on pull_request alone. Keying on the event
#     rather than on the ref's prefix says what is meant, and holds if GitHub
#     ever reshapes the queue ref.
#   - The group key is the run id on every other event, so a queue run shares
#     its group with nothing at all. `cancel-in-progress: false` is not enough on
#     its own: a run held PENDING on a busy group is cancelled outright when a
#     third run arrives, and a re-queued entry at the same base sha carries the
#     same ref as the run still finishing for its ejected predecessor.
#     Unique-per-run is what removes that collision instead of ranking it. Same
#     shape as attribution.yml, which falls through to github.run_id for the
#     same reason. A nightly run and a dispatched one on the default branch
#     share a ref, and the same key keeps either from cancelling the other.
#
# Concurrency therefore never cancels a queue run, and a run whose entry the
# queue has already dropped runs on to its end unless something else cancels
# it. queue-sweep.yml does, on every merge_group event: it cancels a run only
# once its queue ref is proven gone, so a live entry's run is never touched
# (iss-2610110613372021).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The margin the job clock's watchdog leaves before a test job's cap
# (cmd/ci-watchdog; see the check job), declared once for both jobs that run it.
# GOFLAGS is the Makefile's, so the local gates judge the form of the tests these
# jobs run and every job here saves and restores one form of the build cache.
env:
  ABCD_CI_WATCHDOG_MARGIN_MINUTES: 5
  GOFLAGS: -trimpath

jobs:
  # Classify the diff so the duplicated lanes can stand down on a change that
  # cannot move them. This job must never fail: a skipped dependent reports the
  # same conclusion whether it stood down deliberately or lost its classifier,
  # and the second reading would let a source change through unbuilt. So it
  # reports its verdict on stdout and exits zero on every path, an abort resolves
  # to the full matrix, and the dependents guard against it failing anyway.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      inert: ${{ steps.classify.outputs.inert }}
    steps:
      # Full history: the diff is taken against the merge base with the pull
      # request's base commit, which a shallow checkout does not carry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the changed paths
        id: classify
        env:
          # Read through the environment rather than expanding the expression
          # into the script body, which would splice event data into shell source.
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          inert=false
          reason='the classifier did not reach a verdict'
          written=false
          changed="$RUNNER_TEMP/changed-paths.z"

          # Errexit cannot be the safety net here: a failed step would fail the
          # job and skip the matrix, the one outcome worse than running it. The
          # trap converts every abort into the full matrix, loudly.
          finish() {
            status=$?
            if [ "$written" = false ]; then
              echo "::error::the inert-path classifier aborted (exit ${status}); running the full matrix"
              # Recording the verdict is itself a step that can fail, and it must
              # not take the job down with it: an output nobody set reads as
              # empty, which is already the full matrix.
              if ! printf 'inert=false\n' >>"$GITHUB_OUTPUT"; then
                echo "::error::the verdict could not be recorded either"
              fi
            fi
            exit 0
          }
          trap finish EXIT

          # The inert allowlist: user-facing documentation, the durable record,
          # and the shared working tier, plus the root files that are prose or
          # licence text and the two community-health prose files in .github/.
          # The conventions file (AGENTS.md) is deliberately absent — it
          # configures agent behaviour.
          is_inert_path() {
            case "$1" in
              docs/*|.abcd/development/*|.abcd/work/*) return 0 ;;
              README.md|CHANGELOG.md|RELEASE.md|ACKNOWLEDGEMENTS.md|LICENSE|LICENSE.md) return 0 ;;
              .github/CONTRIBUTING.md|.github/SECURITY.md) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Errexit is suspended inside an `if` condition, so every command below
          # tests its own status. Returning non-zero means "not proven inert".
          classify() {
            if [ "$EVENT_NAME" != pull_request ]; then
              reason="the ${EVENT_NAME} event carries no base to diff against"
              return 1
            fi
            if [ -z "$BASE_SHA" ]; then
              reason='the pull request payload carries no base commit'
              return 1
            fi
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              reason="base commit ${BASE_SHA} is absent from this checkout"
              return 1
            fi
            # Three-dot, so the comparison is against the merge base. When the
            # base branch has moved on, the merge base is still the recorded base
            # commit and the diff widens to include what landed meanwhile — which
            # errs towards the full matrix.
            #
            # --no-renames is load-bearing: with detection on, moving a source
            # file into docs/ reports the destination alone, and the vanished
            # source path never reaches the allowlist. Reported as a delete plus
            # an add, both paths are judged.
            if ! git diff --no-renames --name-only -z "${BASE_SHA}...HEAD" -- >"$changed"; then
              reason='diffing against the merge base failed'
              return 1
            fi
            if [ ! -s "$changed" ]; then
              reason='the diff against the merge base is empty'
              return 1
            fi
            echo 'changed paths:'
            # Indented so no byte of a hostile filename lands in column 1,
            # where the runner's log parser reads `::`-prefixed lines as
            # workflow commands.
            tr '\0' '\n' <"$changed" | sed 's/^/  /'
            # NUL-delimited, so a path holding a newline, a space, a glob
            # character or a leading dash stays one record and is only ever
            # matched as a pattern subject, never expanded or executed.
            count=0
            while IFS= read -r -d '' path; do
              count=$((count + 1))
              if ! is_inert_path "$path"; then
                reason="${path} is outside the inert allowlist"
                return 1
              fi
            done <"$changed"
            reason="all ${count} changed paths are documentation or record"
            return 0
          }

          if classify; then
            inert=true
          fi
          printf 'inert=%s\n' "$inert" >>"$GITHUB_OUTPUT"
          written=true
          # The reason can embed a hostile filename, newlines included; indent
          # every line of it off column 1 for the same non-injection guarantee
          # as the path list.
          echo "verdict: inert=${inert}"
          printf '%s\n' "$reason" | sed 's/^/  /'

  # Build + vet + test on Linux, on every event. Race-enabled unit tests catch
  # data races the plain `go test` would miss. On an inert change the race lane
  # stands down, while the job builds, vets, tests and runs the record gates as
  # usual. macOS has jobs of its own below: macos-suite and check-macos.
  #
  # `!cancelled()` rather than the implicit `success()`: a classifier that fails
  # for its own reasons — a flaky checkout, the timeout — must not skip this job.
  # An unset output is empty, which reads as not inert, so the fallback is the
  # full matrix.
  check:
    needs: changes
    if: ${{ !cancelled() }}
    # The name is the context the ruleset requires
    # (.abcd/work/rulesets/main-protection.json), written out so it reads the
    # same as check (macos-latest), the other half of the pair.
    name: check (ubuntu-latest)
    # This ceiling exists only to free the queue when something is truly stuck; it
    # does not judge speed (dcn-2611062201286033, which withdrew the rule that a
    # second cancellation stops a pull request). A run nearing it is reported by the
    # warning step below and answered by speed work, a queue entry dropped with no
    # failing test is re-armed until it lands, and a real failure gets fixed.
    #
    # It sits just under the merge queue's check response timeout (90 minutes
    # since 2026-10-11, recorded in .abcd/work/rulesets/main-protection.json),
    # which is the outer ceiling on a merge-group run: the queue fails the group
    # when this required check has not concluded by then, so a job ceiling above
    # it would be unreachable there. The drain bundle (spc-2610161044461448) grew
    # the loop package's race run until the job reached 31 minutes, and it spent
    # from 2026-10-17 at 45 (dcn-2610171803056931). It came back to 30 when the
    # job's plain pass stopped rerunning every internal test the race lane
    # already runs (iss-2610171803053186): the worst of five merge-group runs had
    # spent 9.3 minutes on that rerun. The coordinating session raised it to 45
    # again on 2026-10-28, on delegation from the technical facilitator
    # (dcn-2610280635092222): merge-group runs took 29, 29 and 29 minutes and a
    # fourth was cancelled at 30, a second after its race tests passed, which
    # rebuilt every group queued behind it. At 45 the job clock's watchdog fired at
    # 40, the cap less its margin, and queue runs reach about 40 with no test
    # failing, so an entry left the queue with nothing failed; 60
    # (iss-2611061904457784) moved that to 55 and stayed close to the same runs. It
    # is 85 since dcn-2611062201286033, 5 under the queue's timeout: the watchdog
    # fires at 80 and the warning, ten minutes ahead of the cap, at 75. The test
    # steps' -timeout, 70m, lifts go test's 10m per-package default, so a slow
    # package is not failed while the job has room. The step names its slowest
    # packages first, so they start with the step rather than behind every faster
    # package; a hang in a package that starts within the job's first ten minutes
    # fails at its own timeout, with a goroutine dump, and a hang in one that starts
    # later meets the job clock's watchdog below first.
    # TestRaceLaneBudgetIsDeclaredAndFitsItsJob holds the ceiling below the queue's
    # cap, and TestEachTestJobWarnsBeforeItsCap holds the warning step at the
    # end of the job below it.
    timeout-minutes: 85
    runs-on: ubuntu-latest
    # The job clock's watchdog (cmd/ci-watchdog). go test's -timeout counts
    # from each test binary's own start, so a package that starts late meets
    # this job's cap first and is cancelled with no goroutine dump: on a
    # passing merge-group run the last package started 23.8 minutes into this
    # job, so a 70m -timeout there would run to 93.8, past the cap of 85. Every
    # step that runs go test, here and in macos-suite, therefore runs under the
    # watchdog, which sends the test binaries under go test SIGQUIT (each prints
    # its goroutines and fails) at the cap less the margin on the clock the
    # "Record the job's start" step exports, then the step SIGKILL after 30
    # seconds (dcn-2610311047146087). The cap here
    # repeats the job's timeout-minutes, and the margin is the workflow's;
    # TestCheckJobTestStepsRunUnderTheJobClockWatchdog holds both, and every
    # go test step's shell.
    env:
      ABCD_CI_LEG: check (ubuntu-latest)
      ABCD_CI_JOB_CAP_MINUTES: 85
    steps:
      # The clock for the warning step at the end of the job. It is the first step
      # that runs, so the time the runner spent before it (queueing, set-up) is not
      # counted, and the elapsed time the warning reads is a lower bound on what
      # the merge queue's clock shows. The same instant is the job clock's
      # watchdog's (the job's env above).
      - name: Record the job's start
        id: started
        run: |
          epoch=$(date +%s)
          echo "epoch=${epoch}" >>"$GITHUB_OUTPUT"
          echo "ABCD_CI_JOB_STARTED=${epoch}" >>"$GITHUB_ENV"

      # Full history: the record-lint step below arms `-agent-diff` against the
      # base commit, and a three-dot range needs the base object AND a merge
      # base, neither of which a depth-1 clone holds — with the default shallow
      # checkout the arm was unreachable and the step fell back in silence.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-go caches the module and build caches by default, keyed on the
      # runner's OS and architecture, the toolchain and go.sum, and saves them
      # at the end of a run whose key missed. A pull-request or merge-queue run
      # can restore a cache saved on the default branch but not one saved on
      # another pull request's ref, so the default branch's cache is the one
      # every job starts warm from. With no push trigger, the nightly run is
      # what saves it on the default branch, for both runners, after each change
      # to go.sum or the toolchain, and what keeps it from ageing out.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The go directive in go.mod is the ONLY place the toolchain is written,
          # here and in every other setup-go step in this repository. A literal
          # beside it is a second spelling to bump, and the one that gets forgotten
          # puts this lane on a different toolchain from the format gate below —
          # which resolves go.mod's — so CI's two halves would disagree about which
          # gofmt is correct (iss-2609090951291799).
          go-version-file: go.mod

      # Enforce the format gate AGENTS.md documents, by INVOKING it rather than
      # restating it. The target resolves gofmt from the toolchain go.mod
      # declares, so this job and the developer's pre-push run are the same gate
      # judged by the same binary; the inline copy that used to live here read
      # whichever gofmt was on PATH, and diverged from the developer's the moment
      # their machine moved ahead of the pin (iss-2609081953452204). Formatting is
      # platform-independent, so it runs only in this job, not on macOS; any file
      # it lists needs `make fmt` and fails the job.
      - name: Format (gofmt)
        run: make fmt-check

      # Unconditional, because tests assert against the live record.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # ABCD_TEST_SKIP_FLUSH lets the test binaries skip the flush to stable
      # storage (internal/fsutil/flush.go), an F_FULLFSYNC of about 8.8 ms per
      # synced write on macOS that no test asserts anything about. It needs a
      # test binary as well, so nothing built here stops flushing.
      #
      # This job's plain pass runs what its race lane does not
      # (iss-2610171803053186). Where the race lane runs, it runs every test
      # under ./internal/..., so a plain rerun of them repeated it: 7 to 9.3
      # minutes of a job that had reached 31 against its 30-minute ceiling, on
      # a runner whose four cores both passes already kept busy. So the plain
      # pass covers the packages outside internal/, and, by name, the tests
      # that assert only without the race detector ("Test (plain-only
      # guards)", below). On an inert change the race lane stands down, and
      # the plain pass runs the whole module, as the job's only test pass.
      # TestMacOSLegRunsItsSuiteOnlyNightlyAndOnDemand holds which passes run on
      # which event, here and in macos-suite.
      #
      # On an inert change, where it runs, the two packages named ahead of the
      # pattern are the slowest in this pass (126-187s and 110-147s on the
      # four-core runner, 2026-10-15). In import-path order
      # internal/surface/cli started about three and a half minutes into the
      # step and finished it alone; named first, both start with the step. The set is still exactly ./... (go test runs a package
      # named twice once), which TestPlainTestStepRunsTheWholeModule pins.
      # It shards the longest packages as preflight does, and its -timeout is this
      # job's budget, the race step's below: as one process under go test's
      # ten-minute default, internal/core/implement/loop crossed 600s here on
      # 2026-10-30 with no test hung (iss-2610302058222905).
      # TestCIRacePassesShardLikePreflight holds the count, and
      # TestPlainTestStepRunsTheWholeModule the timeout.
      - name: Test
        if: needs.changes.outputs.inert == 'true'
        shell: go run ./cmd/ci-watchdog bash --noprofile --norc -eo pipefail {0}
        env:
          ABCD_TEST_SKIP_FLUSH: "1"
          ABCD_TEST_SHARDS: "3"
        run: go test -count=1 -timeout 70m ./internal/core/implement/loop ./internal/surface/cli ./...

      # Every package ./... matches that ./internal/... does not;
      # TestTheOutsideInternalStepRunsWhatTheRaceLaneDoesNot holds the set.
      - name: Test (outside internal)
        if: needs.changes.outputs.inert != 'true'
        shell: go run ./cmd/ci-watchdog bash --noprofile --norc -eo pipefail {0}
        env:
          ABCD_TEST_SKIP_FLUSH: "1"
        run: go test -count=1 ./cmd/...

      # The tests that assert only without the race detector: cost guards that
      # count work or bound CPU time, which under -race measure the
      # instrumentation, so they skip there or drop their bound. The race lane
      # runs them and asserts nothing, so they run here, plain, by name; they
      # are what catches a quadratic blow-up. The list is derived from the
      # test files: TestEveryLegRunsEveryPlainOnlyGuard reads every one
      # under internal/ and fails until this step names exactly those tests and
      # their packages.
      - name: Test (plain-only guards)
        if: needs.changes.outputs.inert != 'true'
        shell: go run ./cmd/ci-watchdog bash --noprofile --norc -eo pipefail {0}
        env:
          ABCD_TEST_SKIP_FLUSH: "1"
        run: go test -count=1 -run '^(TestAHereDocBodyFeedStaysLinear|TestAPatternPastTheStepBudgetIsNotGenerated|TestAVeryDeepPathIsJudgedQuickly|TestAdjacencyProbeStaysLinearOnLongLines|TestAdjacencyProbeWindowIsBounded|TestBacktickPrePassStaysLinear|TestBraceScanStaysLinear|TestClosedOverDocumentsStayLinear|TestClosingScansAreLinear|TestDoubleQuotedBraceExpansionStaysLinear|TestExpandedHeredocBodyStaysLinear|TestForgeTextWorkIsLinear|TestGallopingProbeCostIsLinearInLineLength|TestGallopingProbeStaysBoundedOnLongLines|TestGluedFixedOutputStaysLinear|TestGluedSweepWorkIsLinear|TestHereDocumentPayloadStaysLinear|TestHistoryCaptureAcceptsWhatTheHooksAccept|TestHomeSpellingsStayLinear|TestIFSSplitCheckStaysLinear|TestJunctionBacktrackIsBounded|TestKillFeedGroupsAndStringsStayLinear|TestKillFeedReadingStaysLinear|TestMakerNoteWorkIsLinear|TestMetadataViewsWorkIsLinear|TestNestedHereDocumentPayloadStaysLinear|TestParameterExpansionReadingStaysLinear|TestPatternShapesStayLinear|TestQuotedSubstitutionStaysLinear|TestRawHeadingScanStaysLinearInTheOpenerCount|TestScanLineWorkIsLinear|TestScriptReadingStaysLinearOnAdversarialLines|TestSpeculationIsBoundedAtTheStdinCap|TestSpellingSetsStayLinear|TestSurfaceChapterProseStatesNoShape|TestSweepCallerHomeWorkIsLinear|TestSynopsisScanIsLinearInThePage|TestTheBudgetBoundsWallTimeOverLongLiterals|TestTheBudgetBoundsWallTimeOverManyLines|TestTheHiddenHTMLReadersStayLinear|TestTheTagWalksStayLinear|TestUTF16ViewWorkIsLinear|TestUnknownWordWalksStayLinear)$' ./internal/adapter/scanner ./internal/core/claim ./internal/core/guard ./internal/core/reading ./internal/surface/cli

      # Only a source change can introduce a data race. On an inert change the
      # plain pass above runs the whole module in this lane's place.
      #
      # -timeout is a declared budget, not go test's 10m per-package default:
      # internal/surface/cli under -race on the macOS runner measured 418-568s
      # passing, and a slow runner crossed 600s with no test hung, ejecting an
      # unrelated pull request from the merge queue (iss-2609260319483365). The
      # budget was first 20m, about twice the slowest passing run, then 40m from
      # 2026-10-17, and is 70m since dcn-2611062201286033, so a slow package is not
      # failed at 40 minutes while the job has room. A real hang still fails with a
      # goroutine dump where the enclosing ceiling leaves room for it: in a package
      # that starts within this job's first ten minutes it does, while on a later
      # package the job clock's watchdog, held below the merge queue's response cap,
      # is the binding one (see the job header). release.yml's verify job carries the
      # same flag, so a package this lane passed does not then fail a cut; the
      # Makefile's preflight recipe carries 40m and a macOS shard's race pass its own
      # budget. TestRaceLaneBudgetIsDeclaredAndFitsItsJob holds all four.
      #
      # The packages named ahead of the pattern are the slowest under -race
      # (iss-2609281715083637). go test starts packages in the
      # order its arguments list them, three at a time on the macOS runner, and
      # in import-path order internal/surface/cli started among the last and ran
      # alone as the step's tail. go test runs a package named twice once, so the
      # set is still exactly the pattern's; the same test pins that with go list.
      # internal/core/implement/loop and internal/core/interview joined the list
      # on 2026-10-15: 172-244s and 160s under -race on the ubuntu runner, they
      # started last in import-path order and were still running when two
      # checks were cancelled at the job's 30-minute ceiling.
      #
      # ABCD_TEST_SHARDS runs each package that opts in through
      # internal/testshard (internal/core/implement/loop, internal/core/claim
      # and internal/surface/cli) as that many test processes, each with its
      # share of the tests under the same -timeout, as the preflight recipe does
      # (iss-2610290720087336). As one process implement/loop took 2244s of the
      # macOS pass's 40 minutes on a passing run, and a queue entry timed out on
      # it with no test hung. This step, a macOS shard's race pass and both of
      # release.yml's verify test steps carry the same count as the preflight recipe;
      # TestCIRacePassesShardLikePreflight holds them, and the plain Test step above,
      # to it.
      - name: Test (race, internal)
        if: needs.changes.outputs.inert != 'true'
        shell: go run ./cmd/ci-watchdog bash --noprofile --norc -eo pipefail {0}
        env:
          ABCD_TEST_SKIP_FLUSH: "1"
          ABCD_TEST_SHARDS: "3"
        run: go test -race -count=1 -timeout 70m ./internal/surface/cli ./internal/core/reading ./internal/core/launch ./internal/core/lifeboat ./internal/core/lint ./internal/adapter/scanner ./internal/core/implement/loop ./internal/core/interview ./internal/core/capture ./internal/core/ahoy ./internal/core/site ./internal/...

      # Drift gate for the .abcd/development design record. Blocking: a
      # blocker-severity finding exits non-zero and fails the job; warn-level
      # findings surface in the log only.
      #
      # `-agent-diff` additionally arms agent_contract's unbumped-edit check,
      # which needs a base revision to compare against.
      #
      # THE FALLBACK CHAIN, argued once here for the two range-scoped gates
      # that share it (this step, and the RS001/RS002 step in the record-lint
      # job). The two events that gate a merge name their base
      # in different fields, and the chain must cover both or a gate goes quiet
      # on the event it does not cover — which is what happened to the merge
      # queue (iss-2609091258115663). `merge_group.base_sha` is the base the
      # queue entry was formed against, and reaching it matters most: the queue
      # entry is the run that actually GATES the merge, and the only run that
      # sees the final base after a competing pull request merged ahead of it,
      # which is exactly the race a range check exists to catch. The two fields
      # are mutually exclusive — no event carries both — so the order states
      # precedence rather than selecting between live values.
      #
      # The nightly schedule and a dispatched run carry no base at all: they
      # check a branch tip, not a change, so the chain resolves to the empty
      # string there and each range gate announces that it did not run. Neither
      # field can name a commit this checkout lacks on the events that carry it,
      # but the step still probes rather than assuming: an empty or unusable
      # base falls back to the unarmed run rather than failing, and every
      # tree-shaped rule (the agent-prompt frontmatter, the canary, the
      # changelog entry) runs either way. The fallback is loud, as a warning on
      # the two events that should always name a base and a notice on the ones
      # that never do: a downgrade nobody can see is a gate nobody knows is off.
      - name: Record-lint (drift gate)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] &&
            [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] &&
            git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            go run ./cmd/record-lint -agent-diff "${BASE_SHA}...HEAD"
          else
            case "${GITHUB_EVENT_NAME:-}" in
              pull_request | merge_group) level=warning ;;
              *) level=notice ;;
            esac
            echo "::${level}::record-lint ran unarmed on this ${GITHUB_EVENT_NAME:-unnamed} run: no base commit for -agent-diff (BASE_SHA='${BASE_SHA:-}'), so agent_contract's unbumped-edit check did not run"
            go run ./cmd/record-lint
          fi

      # Promote-join drift gate (itd-4 AC3): both halves of every promote join
      # (`related_issues` on the intent, `related_intents` on the ledger record)
      # agree, no id dangles, a shipped intent's issue reached resolved/, and no
      # retired `promoted_to` / `promoted_from` key survives. `--strict` turns
      # the verb's warning into a failure; `make issue-drift` runs the same line.
      - name: Issue-drift (promote-join gate)
        run: go run ./cmd/abcd intent audit --issue-drift --strict

      # Docs-currency gate (itd-60): the internal/core/lint engine over docs/ and
      # the repo root, driven via the `abcd lint docs` verb. Blocking — a doc-body
      # change-narration, broken relative link, or stray root markdown fails CI.
      - name: Docs-lint (currency gate)
        run: go run ./cmd/abcd lint docs

      # Site-render gate (iss-2608241845109280): the site renders the record as
      # well as docs/, and the renderer refuses markdown outside its supported
      # subset. This lane always runs — the changes classifier never stands this
      # job down — so a records-only pull request is covered here, which
      # site-screenshots.yml's path filter does not cover. Build, then `lint
      # site` the output: the publish gates (provenance, banned-tokens,
      # baseline, ...) are what release.yml's post-publish site job runs, so a
      # change that renders but trips a check gate must fail HERE, not after the
      # binaries ship. `lint site` excludes docs/, so no mkdocs step is needed.
      # The record is also built on the project route, from .abcd/project-site.json,
      # below the base path GitHub Pages serves it at (itd-2610142145236613): a
      # repository has one Pages site, so the record has no preview, and this
      # gate is where a change that would break its next release fails.
      - name: Site-render gate
        run: |
          go run ./cmd/abcd site build --out "$RUNNER_TEMP/site-render-check"
          go run ./cmd/abcd lint site --out "$RUNNER_TEMP/site-render-check"
          go run ./cmd/abcd site build --project --base-path /abcd/ --out "$RUNNER_TEMP/project-site-render-check"
          go run ./cmd/abcd lint site --project --base-path /abcd/ --out "$RUNNER_TEMP/project-site-render-check"

      # Warn before the cap cancels. A check that runs past WARN_AFTER_MINUTES is ten
      # minutes from its job's ceiling, and a cancellation there carries nothing but
      # the cancellation. The cap only frees a stuck run and does not judge speed
      # (dcn-2611062201286033), so this warning is how a slow suite is reported, and
      # speed work answers it. A queue entry dropped at the cap with no failing test
      # is re-armed until it lands, and a real failure gets fixed. The warning is
      # emitted at the job's end, for a run that
      # finished past the line, so a check that passed within ten minutes of its
      # job's cap says so before one is cancelled at the cap. It never fails the
      # job: `always()` runs it however the steps before it ended, and
      # `continue-on-error` holds even a broken script to a warning. macos-suite
      # carries the same script. TestEachTestJobWarnsBeforeItsCap pins each
      # job's threshold ten minutes below that job's ceiling, CEILING_MINUTES, the
      # cap the message names, to that ceiling, and the two scripts to one.
      - name: Warn when the check nears its job's cap
        if: always()
        continue-on-error: true
        env:
          STARTED_AT: ${{ steps.started.outputs.epoch }}
          WARN_AFTER_MINUTES: 75
          CEILING_MINUTES: 85
        run: |
          case "${STARTED_AT:-}" in
            '' | *[!0-9]*)
              echo "::notice::no job start was recorded, so the elapsed-time warning did not run"
              exit 0
              ;;
          esac
          elapsed=$(($(date +%s) - STARTED_AT))
          minutes=$((elapsed / 60))
          echo "${ABCD_CI_LEG} has run ${minutes}m $((elapsed % 60))s; the warning line is ${WARN_AFTER_MINUTES}m"
          if [ "$elapsed" -gt $((WARN_AFTER_MINUTES * 60)) ]; then
            msg="${ABCD_CI_LEG} ran ${minutes} minutes, past the ${WARN_AFTER_MINUTES}-minute warning line and close to the job's ${CEILING_MINUTES}-minute cap. The cap only frees a stuck run and does not judge speed, so nearing it calls for speed work on the suite. A queue entry dropped at the cap with no failing test is re-armed until it lands, and a real failure gets fixed."
            echo "::warning title=${ABCD_CI_LEG} near its cap::${msg}"
            printf '### %s near its cap\n\n%s\n' "$ABCD_CI_LEG" "$msg" >>"$GITHUB_STEP_SUMMARY"
          fi

  # The macOS suite, as shard jobs (iss-2610181757540736). It keeps its runner's
  # three test slots full, so its time is its total work on that runner, and
  # hosted macOS runners vary about twofold: one pass over the module took 32
  # minutes on one and 77 on another with the same work and the same restored
  # cache, and past its 80-minute deadline on others. Only several runners shorten
  # what one runner has to do. Three shards brought the slowest passing run's 76.6
  # minutes to about 27 of testing in a shard, and about 30 with its set-up and the
  # compiling a single job shared.
  #
  # Why four. internal/core/implement/loop runs as three test processes, each with
  # the whole of -timeout, and on a slow runner all three reached that limit in
  # ordinary tests, with no test failing (run 42197788864). cmd/ci-shard gives it the
  # last shard alone, which is meant to give it more of the runner's cores; its time
  # alone is not yet measured. The other three shards share the rest. macOS is the
  # scarcest runner this account has, five jobs at once: one run's four shards leave
  # one free and a fifth would leave none, and what decides a run is the last shard
  # to get a runner.
  #
  # It runs nightly and by hand: on every event that is neither a pull request nor
  # a merge-queue entry (dcn-2611042202509334). The pre-push hook refuses a
  # commit without its local preflight receipt, a client-side check that a
  # --no-verify push skips, so a pull-request macOS run repeated a local run, on the developer's machine
  # (iss-2610110938282654), and in the queue a shard's wait for a runner ran on the
  # queue's clock: on 2026-11-04 entries kept dropping because GitHub had no macOS
  # runner to give, with no test failing. A pull request and a queue entry skip this
  # job at its `if:`, and check-macos below reports the required context all the
  # same. It reads no classifier: no pull request reaches it, and every other event
  # is never inert, so a need on `changes` would only add a way for the suite to be
  # skipped.
  #
  # A shard's steps and its ceiling are in macos-suite.yml, which release.yml's
  # macOS gate calls too, so a cut runs the same suite (dcn-2611042202509334).
  #
  # The packages come from cmd/ci-shard, computed from `go list` under the race
  # build in every shard, so no list is kept by hand and a package added later is tested without
  # anyone naming it. TestMacOSSuiteShardsCoverTheModule runs what this matrix asks
  # for and holds the union to the module's packages and the shards to disjoint;
  # the shard count comes from the matrix itself (strategy.job-total), so the two
  # cannot drift. To add a shard, add it to the matrix and resize the sums above.
  #
  # fail-fast: a failed shard has decided the run, and the rest would hold scarce
  # runners for an answer already known.
  # TestMacOSLegRunsItsSuiteOnlyNightlyAndOnDemand holds all of this per event and shard.
  macos-suite:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    uses: ./.github/workflows/macos-suite.yml
    with:
      shard: ${{ matrix.shard }}
      shards: ${{ strategy.job-total }}
      ref: ${{ github.sha }}
      cache: true

  # The required context `check (macos-latest)`, reported from an ubuntu runner on
  # every event: the ruleset requires that name
  # (.abcd/work/rulesets/main-protection.json), and a shard must never read as the
  # whole suite. It runs however the shards ended, and passes in exactly two cases:
  # on an event the suite runs on when every shard succeeded (a matrix job's result
  # is success only when every leg's is), and on a pull request or a merge-queue
  # entry when the shards were skipped as they should be, each with its own notice
  # that no macOS suite ran. A shard failed, cancelled or abandoned (what a shard
  # that never got a runner reads as, run 41901793293), or skipped anywhere else,
  # fails it: a green here may only stand for work that happened. `always()` is on
  # the step as well as on the job, because a step's implicit success() is false on
  # a cancelled run, and a job whose steps are all skipped concludes success. So a
  # run cancelled mid-suite reads as failed. A cancelled or superseded pull-request
  # or queue run still reports the stand-in: there the context never tested anything
  # and says so, and the run's other required contexts hold that commit.
  # TestMacOSCheckFailsUnlessEveryShardSucceeded runs this script over every result
  # per event.
  check-macos:
    name: check (macos-latest)
    needs: macos-suite
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every macOS shard's success
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          SUITE_RESULT: ${{ needs.macos-suite.result }}
        run: |
          echo "macos-suite concluded '${SUITE_RESULT}' on a ${EVENT_NAME} event"
          case "$EVENT_NAME" in
            pull_request)
              msg="On a pull request check (macos-latest) reports without taking a macOS runner, so this run tested nothing on macOS. The macOS suite runs nightly on the default branch and on demand."
              ;;
            merge_group)
              msg="No macOS suite ran on this entry: the merge queue tests on Linux, and this context reports without taking a macOS runner. The nightly run covers the default branch."
              ;;
            *)
              msg=""
              ;;
          esac
          if [ -n "$msg" ]; then
            if [ "$SUITE_RESULT" = skipped ]; then
              echo "::notice title=macOS suite runs nightly::${msg}"
              printf '### macOS suite runs nightly\n\n%s\n' "$msg" >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error title=check (macos-latest)::the shards did not stand down on a ${EVENT_NAME} event (result '${SUITE_RESULT}'), so this context cannot report as the stand-in it is there"
            exit 1
          fi
          if [ "$SUITE_RESULT" != success ]; then
            echo "::error title=check (macos-latest)::the macOS suite's result is '${SUITE_RESULT}', not success; read the macos-suite jobs of this run"
            exit 1
          fi

  # Secrets never land in history: the history each run would land is scanned —
  # a pull request's own commits, and the full history of the queued or
  # checked commit — never every ref the checkout fetched. Run as a
  # pinned, checksum-verified CLI (no PR-comment / SARIF GitHub-API integration),
  # so it works on a private repo and survives the private->public flip. A
  # non-zero exit means gitleaks found a secret.
  gitleaks:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      # Hand-reviewed pin: an env-var version is invisible to dependabot's
      # github-actions ecosystem, so bumps are a deliberate maintainer act
      # (reviewed at each release cut), not an automated PR.
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLf -o "$base" "$url/$base"
          curl -sSLf -o checksums.txt "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $base\$" checksums.txt | sha256sum -c -
          tar -xzf "$base" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # Scoped to the history this run would land (iss-2608282038283692).
      # fetch-depth: 0 fetches every remote branch, and a bare `gitleaks git .`
      # walks `git log --all`, so a secret on a stale branch whose pull request
      # had closed failed every open pull request until the branch was deleted.
      # A pull request scans its own range, base..HEAD; a merge-queue entry
      # scans everything reachable from HEAD, which is the full history of what
      # lands, and so does the nightly or dispatched run, the full history of
      # the branch it checks. A pull request whose base cannot be
      # resolved scans wider, never narrower, and says so. Event data reaches the
      # script through env only (injection-safe).
      - name: Scan the history this run would land
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          scope=HEAD
          if [ "$EVENT_NAME" = pull_request ]; then
            if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              scope="${BASE_SHA}..HEAD"
            else
              echo "::warning::gitleaks: no usable pull-request base (BASE_SHA='${BASE_SHA:-}'); scanning the full history reachable from HEAD instead"
            fi
          fi
          echo "gitleaks: scanning ${scope}"
          gitleaks git --redact --no-banner --log-opts="${scope}" .

  # Audit the workflows themselves (pwn requests, template injection, cache
  # poisoning, unpinned uses). Run as a pinned CLI image (no SARIF upload to
  # code-scanning, which a private repo lacks). A non-zero exit means a finding.
  # Anything under .github/ is outside the inert allowlist, so the audit runs on
  # every change that could alter what it audits.
  zizmor:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.inert != 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows
        run: |
          # zizmor v1.26.1, pinned by digest (the registry publishes version
          # releases under :latest; a raw vX.Y.Z tag does not exist). A digest
          # inside a run: block is invisible to dependabot, so this pin too is
          # hand-reviewed at each release cut.
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" \
            ghcr.io/zizmorcore/zizmor@sha256:d1117e5dbd9ee4970644067b534ab6ab50371f3c6f7f4d05446eb603a6e78f48 \
            --persona regular /src
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The committed workflows above are the abcd profile alone. Every profile
      # the scaffold lays down in a managed repository is rendered and audited
      # by the same pinned zizmor, so action pinning, permissions and
      # credential handling are held there too, not only the injection and
      # duplicate-key classes the in-repo audit covers (iss-2609251939472371).
      - name: Audit the scaffolded workflow profiles
        run: |
          go run ./cmd/scaffold-render "$RUNNER_TEMP/scaffold-profiles"
          docker run --rm -v "$RUNNER_TEMP/scaffold-profiles:/profiles:ro" \
            ghcr.io/zizmorcore/zizmor@sha256:d1117e5dbd9ee4970644067b534ab6ab50371f3c6f7f4d05446eb603a6e78f48 \
            --persona regular /profiles

  # The working-tier ledger gates: the .abcd/work/reviews/ charter (RD001-RD004)
  # and the issue-resolution gate (RS001-RS006), each after the cases that prove
  # it can fail. The design-record
  # drift gate, cmd/record-lint, is NOT here: it is a step of the `check` job.
  # The job keeps the id `record-lint` because that id is the required status
  # check the main-protection ruleset names (.abcd/work/rulesets/
  # main-protection.json); renaming the job alone leaves the merge gate waiting
  # on a check that never reports, so a rename lands only together with the
  # live ruleset edit (iss-2609251358062952). Needs full history: RD002
  # (append-only) checks committed history for post-creation edits, so
  # fetch-depth: 0 (the default shallow checkout would miss them). The RD half
  # is a stopgap until the RD codes land in internal/core/lint.
  record-lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reviews-charter gate can fail (cases)
        run: bash scripts/check-reviews-cases.sh

      - name: Reviews-charter discipline (RD001-RD004)
        run: bash scripts/check-reviews.sh

      # The cases run before the gate, deliberately. They prove the gate can
      # refuse a violating fixture; a gate whose rules have never been watched
      # fail is an enforcement claim with nothing behind it, and its green is
      # worse than no check at all (iss-2608230847432286).
      - name: Issue-resolution gate can fail (cases)
        run: bash scripts/check-issue-resolution-cases.sh

      # RS003 over the whole ledger: every resolved_by.commit stamp still
      # resolves and is still reachable. This is what notices the day a squash
      # or rebase merge rewrites a cited branch sha out of existence.
      - name: Issue-resolution stamps are reachable (RS003)
        run: bash scripts/check-issue-resolution.sh ledger HEAD

      # RS001/RS002/RS004/RS005 over the pull request's own range. RS005 is
      # RS001's twin for the intent store: a `Delivers: itd-N` trailer must see
      # that intent enter shipped/ in the same range. RS004 is the
      # commit half of the record-mention rule (iss-2609100507421759): a message
      # that names an iss-N declares `Resolves:` or `Refs:`. Its pull-request
      # half lives in attribution.yml, the one workflow that re-runs on an
      # `edited` title or body. On a merge-queue entry the base is the one the
      # entry was formed against, so the range is the would-be merge; the
      # nightly and dispatched runs name no base, and the step says it skipped
      # the range checks. That last rung is the one this check needs
      # most and the one it lacked (iss-2609091258115663): a pull request whose
      # base was clean when it was armed could merge a resolution that a
      # competitor made terminal while it waited, because the only run that
      # could have seen the collision was the one where the check skipped
      # itself. The chain's order is argued at the record-lint step above.
      - name: Declared resolutions and deliveries move the record, mentions declare themselves (RS001/RS002/RS004/RS005)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            case "${GITHUB_EVENT_NAME:-}" in
              pull_request | merge_group) level=warning ;;
              *) level=notice ;;
            esac
            echo "::${level} title=issue-resolution range checks skipped::the ${GITHUB_EVENT_NAME:-unnamed} event names no usable base ref, so RS001/RS002/RS004/RS005 did not run; RS003 above still ran."
            exit 0
          fi
          bash scripts/check-issue-resolution.sh commits "$BASE_SHA" HEAD

  # Self-discovering smoke harness (evals/): builds the binary, walks the Cobra
  # command tree in-process, and runs every command's --help plus the read-only
  # verbs against the built binary. Catches a command that compiles but panics when
  # actually invoked — which the unit lane (go test ./...) misses, because the
  # harness is behind the `smoke` build tag. What it walks is the command tree,
  # which only a source change moves. The read-only verbs also read the live
  # record, which an inert change can edit — a record-only panic surfaces one
  # hop later, on the merge-queue run (non-inert by classification), which
  # gates the merge, and again in the release verify job, an accepted latency
  # trade.
  smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.inert != 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Load check (skipped on CI, says why)
        run: go run ./cmd/abcd implement load --site eval-harness
      - name: Smoke every command
        env:
          EVAL_TIMEOUT: "6m"
        run: make smoke

  # The cold-reading evals (evals/coldreading_*_test.go), on EVERY event. This job
  # carries no `inert` condition, deliberately, and it is the one lane in this
  # workflow besides the ubuntu unit lane that does not.
  #
  # The smoke job above stands down on a pull request confined to docs/,
  # .abcd/development/, .abcd/work/ and the root prose files. Those are precisely
  # the paths these evals read: a record-only change is the diff MOST able to
  # introduce warm content into material the assembler includes, so standing the
  # eval down there is anti-correlated with the risk — and a stood-down job still
  # reports its check context green, which is a green for work that did not
  # happen. The reasoning is the ubuntu unit lane's, one property further on: that
  # lane always runs because its tests read the live tree under the allowlist, and
  # this one always runs because its subject IS the allowlist.
  #
  # It runs the cold-reading evals ALONE, behind their own make target, so the
  # rest of the smoke harness keeps standing down: the command-tree walk is moved
  # only by a source change, and duplicating it here would pay for it on every
  # record-only pull request. The target selects by build tag, so a second
  # cold-reading eval joins this lane by carrying `//go:build smoke ||
  # coldreading` and needs no edit here.
  #
  # It IS a required status check — the ruleset mirror at
  # `.abcd/work/rulesets/main-protection.json` names its context, and
  # TestColdReadingEvalsIsARequiredStatusCheck holds the three parts of that
  # together (iss-2608311051046981). An always-run lane whose check cannot block
  # a merge reports a conclusion and stops nothing, which is the position the
  # eval exists to make impossible: a record-only pull request reaching main with
  # warm content in included material. Requiring it is safe precisely because it
  # stands down on no event — a `paths:` filter or an `inert` condition here
  # would leave the context permanently pending and wedge the queue.
  cold-reading-evals:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Load check (skipped on CI, says why)
        run: go run ./cmd/abcd implement load --site eval-harness
      - name: Falsify the cold-reading read-block
        env:
          EVAL_TIMEOUT: "6m"
        run: make evals-cold-reading

  # The work-in-progress guard (spc-2610120941441282 step 7, itd-2610120738075547
  # C7, adr-2610120937435856, brief invariant 23). A cloud session pushes its
  # work, checked or not, to a work-in-progress branch, and the pre-push hook
  # admits that push without a receipt; the hook is skipped by --no-verify, so
  # this job is the boundary. It refuses a pull request or merge-queue entry
  # whose source branch holds the path segment `abcd-wip`, or whose diff adds a
  # cloud report (scripts/check-wip-source.sh). That work reaches the default
  # branch only through the person's own collect, on a branch of its own.
  # The check run is the BASE commit's copy of the script, fetched when the
  # clone lacks the base, so a change cannot edit the check it is judged by.
  # Only on the first landing, when the base holds no copy yet, does the
  # change's own copy run, and never for a source branch holding abcd-wip.
  #
  # It runs on EVERY event, like cold-reading-evals and for the same reason: it
  # is a required status check (the ruleset mirror names it), and a stood-down
  # job reports its context green for work that did not happen. The docs-only
  # classifier never stands it down: a work-in-progress branch holding only
  # records is exactly as unchecked as one holding code. On a pull request the
  # source branch is github.head_ref; a queue entry runs on its own temporary
  # ref, so the pull request's number is read from that ref and its source
  # branch from the REST API with this job's read-only token, and the job
  # refuses when either cannot be read. Every value an event supplies reaches
  # the script through env, never by interpolation into it: a branch name is
  # text its author chose. The nightly and dispatched runs carry no change into
  # the default branch and have nothing to judge.
  wip-guard:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The cases first: a check whose refusals have never been watched is an
      # enforcement claim with nothing behind it (iss-2608230847432286).
      - name: Work-in-progress guard can fail (cases)
        run: bash scripts/check-wip-source-cases.sh
      - name: No work-in-progress branch or cloud report reaches the default branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
          pull_request)
            source="$HEAD_REF"
            ;;
          merge_group)
            # refs/heads/gh-readonly-queue/<base>/pr-<N>-<base sha>
            n="$(printf '%s\n' "${QUEUE_REF#refs/heads/}" | sed -n 's|^gh-readonly-queue/..*/pr-\([0-9][0-9]*\)-[0-9a-f][0-9a-f]*$|\1|p')"
            if [ -z "$n" ]; then
              echo "::error title=wip-guard::cannot read the pull request number from the merge-queue ref, so its source branch cannot be judged; refusing."
              exit 1
            fi
            if ! source="$(gh api "repos/$REPO/pulls/$n" --jq .head.ref)" || [ -z "$source" ]; then
              echo "::error title=wip-guard::cannot read pull request #$n's source branch through the REST API; refusing."
              exit 1
            fi
            ;;
          *)
            echo "::notice title=wip-guard::a $EVENT_NAME run carries no change into the default branch, so there is nothing to judge."
            exit 0
            ;;
          esac
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error title=wip-guard::the $EVENT_NAME event names no usable base, so the change's diff cannot be judged; refusing."
            exit 1
          fi
          # The check that judges the change is the BASE commit's copy, never
          # the change's own: a pull request could otherwise edit it to exit 0.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch -q --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::error title=wip-guard::the base commit cannot be read in this clone, so the check it holds cannot be run; refusing."
            exit 1
          fi
          check="$RUNNER_TEMP/check-wip-source.sh"
          if git cat-file -e "$BASE_SHA:scripts/check-wip-source.sh" 2>/dev/null; then
            git show "$BASE_SHA:scripts/check-wip-source.sh" >"$check"
          else
            # The first landing: the base holds no check yet, so the change's
            # own copy runs, and only for a source branch without the segment.
            lowered="$(printf '%s' "$source" | tr '[:upper:]' '[:lower:]')"
            case "/${lowered#refs/heads/}/" in
            */abcd-wip/*)
              echo "::error title=wip-guard::the base holds no work-in-progress guard yet, and the source branch holds the segment abcd-wip; refusing."
              exit 1
              ;;
            esac
            cat scripts/check-wip-source.sh >"$check"
          fi
          bash "$check" "$source" "$BASE_SHA" HEAD

  # The one supply-chain vector unreadable by eye: a dependency swap. Diffs the
  # PR's dependency changes against the advisory databases and fails on a known
  # vulnerability. pull_request only — the action reads the PR's diff, which no
  # other event carries — and NOT a required check, so it
  # can never wedge the queue.
  dependency-review:
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Known-vulnerability scan over the module's own dependency graph, on every
  # event (unlike dependency-review it needs no PR diff). Pinned like every
  # other tool this workflow runs.
  govulncheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.inert != 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
