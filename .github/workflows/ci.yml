name: ci

# Checks on every pull request and on every push to the default branch. Branch
# work is covered by the pull_request trigger alone, so a PR push runs the matrix
# once; the default-branch push keeps the merged tip checked. The check job
# builds, vets and tests on macOS and Linux, with race-enabled internal tests on
# both and the `make fmt-check` format gate, record-lint, the issue-drift check,
# docs-lint and the site-render gate on the ubuntu leg alone. Separate jobs run full-history
# secret scanning, a workflow audit, the reviews-charter and issue-resolution
# gates (RS001-RS003), dependency review, govulncheck, the smoke harness, and the
# cold-reading evals.
#
# The `changes` job classifies the diff, and the duplicated lanes stand down on a
# change confined to the record and the user-facing docs. Two properties make
# that safe to rely on:
#
#   - It classifies fail-closed. Only an explicit allowlist counts as inert, and
#     every other outcome — one unlisted path, a non-PR event, an empty diff, an
#     unreadable base, an aborted script, a failed classifier job — runs the full
#     matrix. Markdown and JSON outside that allowlist (commands/, agents/,
#     hooks/, .abcd/*.json, the harness routers at the repo root) carry
#     behaviour, so they are not inert.
#   - It gates jobs and steps, never the workflow triggers. Every required check
#     context still reports on every pull request; `paths:` filtering would leave
#     one permanently pending and wedge the merge.
#
# What an inert change skips is the SECOND copy of the work and the lanes that
# only a source change can move: the macOS leg, the race lane, the smoke harness,
# and the workflow audit (anything under .github/ is not inert, so the audit
# still runs on every change it could be auditing).
#
# What it does not skip, besides the ubuntu unit lane, is the cold-reading evals.
# Their subject is the allowlist itself — the record and the docs are the material
# the assembler includes — so an inert change is the one most able to break them.
#
# What it does not skip is the ubuntu unit lane. Tests read the live tree under
# the allowlist — lifeboat coverage and the glossary index are asserted against
# the real .abcd/development/**, and grounding thresholds against README.md — so
# a prose-only record change can genuinely turn `go test ./...` red while
# record-lint and docs-lint both pass. Skipping it would let that reach the
# default branch. Alongside it the record gates are `go run` invocations of this
# module, so a record-only change compiles most of the module either way.
on:
  push:
    branches: [main]
  pull_request:
  # Merge-queue entries run the full gate on the would-be merge result. The
  # changes classifier below already treats any non-pull_request event as never
  # inert, so a merge_group run executes everything.
  merge_group:

# One group per ref, so a new push to a PR supersedes the run still in flight for
# it. Default-branch pushes all share a single group, so the cancel expression —
# not the group key — is what keeps a merge from being cancelled mid-run by the
# merge behind it.
#
# A MERGE-QUEUE run is exempt from both halves, and that exemption is load-bearing
# rather than tidy (iss-2609020716560392). A queue entry runs on a temporary ref,
# `refs/heads/gh-readonly-queue/main/pr-N-<base sha>`, which is never the default
# branch — so the ref comparison alone armed cancellation there, and GitHub reads
# a cancelled required check as a FAILED one: it drops the entry and disarms
# auto-merge with nothing said on the pull request. One PR was removed four times
# in a night this way.
#
# Both halves move, because each closes a different window:
#
#   - The cancel expression now excuses the merge_group event by name. Keying on
#     the event rather than on the ref's prefix says what is meant, and holds if
#     GitHub ever reshapes the queue ref.
#   - The group key is the run id on that event, so a queue run shares its group
#     with nothing at all. `cancel-in-progress: false` is not enough on its own:
#     a run held PENDING on a busy group is cancelled outright when a third run
#     arrives, and a re-queued entry at the same base sha carries the same ref as
#     the run still finishing for its ejected predecessor. Unique-per-run is what
#     removes that collision instead of ranking it. Same shape as attribution.yml,
#     which falls through to github.run_id for the same reason.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  # Classify the diff so the duplicated lanes can stand down on a change that
  # cannot move them. This job must never fail: a skipped dependent reports the
  # same conclusion whether it stood down deliberately or lost its classifier,
  # and the second reading would let a source change through unbuilt. So it
  # reports its verdict on stdout and exits zero on every path, an abort resolves
  # to the full matrix, and the dependents guard against it failing anyway.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      inert: ${{ steps.classify.outputs.inert }}
    steps:
      # Full history: the diff is taken against the merge base with the pull
      # request's base commit, which a shallow checkout does not carry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the changed paths
        id: classify
        env:
          # Read through the environment rather than expanding the expression
          # into the script body, which would splice event data into shell source.
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          inert=false
          reason='the classifier did not reach a verdict'
          written=false
          changed="$RUNNER_TEMP/changed-paths.z"

          # Errexit cannot be the safety net here: a failed step would fail the
          # job and skip the matrix, the one outcome worse than running it. The
          # trap converts every abort into the full matrix, loudly.
          finish() {
            status=$?
            if [ "$written" = false ]; then
              echo "::error::the inert-path classifier aborted (exit ${status}); running the full matrix"
              # Recording the verdict is itself a step that can fail, and it must
              # not take the job down with it: an output nobody set reads as
              # empty, which is already the full matrix.
              if ! printf 'inert=false\n' >>"$GITHUB_OUTPUT"; then
                echo "::error::the verdict could not be recorded either"
              fi
            fi
            exit 0
          }
          trap finish EXIT

          # The inert allowlist: user-facing documentation, the durable record,
          # and the shared working tier, plus the root files that are prose or
          # licence text. The harness routers (AGENTS.md, CLAUDE.md, GEMINI.md)
          # are deliberately absent — they configure agent behaviour.
          is_inert_path() {
            case "$1" in
              docs/*|.abcd/development/*|.abcd/work/*) return 0 ;;
              README.md|CHANGELOG.md|RELEASE.md|CONTRIBUTING.md|SECURITY.md|ACKNOWLEDGEMENTS.md|LICENSE|LICENSE.md) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Errexit is suspended inside an `if` condition, so every command below
          # tests its own status. Returning non-zero means "not proven inert".
          classify() {
            if [ "$EVENT_NAME" != pull_request ]; then
              reason="the ${EVENT_NAME} event carries no base to diff against"
              return 1
            fi
            if [ -z "$BASE_SHA" ]; then
              reason='the pull request payload carries no base commit'
              return 1
            fi
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              reason="base commit ${BASE_SHA} is absent from this checkout"
              return 1
            fi
            # Three-dot, so the comparison is against the merge base. When the
            # base branch has moved on, the merge base is still the recorded base
            # commit and the diff widens to include what landed meanwhile — which
            # errs towards the full matrix.
            #
            # --no-renames is load-bearing: with detection on, moving a source
            # file into docs/ reports the destination alone, and the vanished
            # source path never reaches the allowlist. Reported as a delete plus
            # an add, both paths are judged.
            if ! git diff --no-renames --name-only -z "${BASE_SHA}...HEAD" -- >"$changed"; then
              reason='diffing against the merge base failed'
              return 1
            fi
            if [ ! -s "$changed" ]; then
              reason='the diff against the merge base is empty'
              return 1
            fi
            echo 'changed paths:'
            # Indented so no byte of a hostile filename lands in column 1,
            # where the runner's log parser reads `::`-prefixed lines as
            # workflow commands.
            tr '\0' '\n' <"$changed" | sed 's/^/  /'
            # NUL-delimited, so a path holding a newline, a space, a glob
            # character or a leading dash stays one record and is only ever
            # matched as a pattern subject, never expanded or executed.
            count=0
            while IFS= read -r -d '' path; do
              count=$((count + 1))
              if ! is_inert_path "$path"; then
                reason="${path} is outside the inert allowlist"
                return 1
              fi
            done <"$changed"
            reason="all ${count} changed paths are documentation or record"
            return 0
          }

          if classify; then
            inert=true
          fi
          printf 'inert=%s\n' "$inert" >>"$GITHUB_OUTPUT"
          written=true
          # The reason can embed a hostile filename, newlines included; indent
          # every line of it off column 1 for the same non-injection guarantee
          # as the path list.
          echo "verdict: inert=${inert}"
          printf '%s\n' "$reason" | sed 's/^/  /'

  # Build + vet + test on both host OSes. Race-enabled unit tests catch data
  # races the plain `go test` would miss. On an inert change the macos leg and
  # the race lane stand down, while the ubuntu leg builds, vets, tests and runs
  # the record gates as usual. The macos leg is gated step by step rather than
  # dropped from the matrix, so `check (macos-latest)` keeps reporting a
  # conclusion instead of a required context that never arrives.
  #
  # `!cancelled()` rather than the implicit `success()`: a classifier that fails
  # for its own reasons — a flaky checkout, the timeout — must not skip this job.
  # An unset output is empty, which reads as not inert, so the fallback is the
  # full matrix.
  check:
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Full history: the record-lint step below arms `-agent-diff` against the
      # base commit, and a three-dot range needs the base object AND a merge
      # base, neither of which a depth-1 clone holds — with the default shallow
      # checkout the arm was unreachable and the step fell back in silence.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The ubuntu leg always needs a toolchain, because it always builds and
      # tests. The macos leg needs one only when it is the second opinion on a
      # source change.
      - name: Set up Go
        if: matrix.os == 'ubuntu-latest' || needs.changes.outputs.inert != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The go directive in go.mod is the ONLY place the toolchain is written,
          # here and in every other setup-go step in this repository. A literal
          # beside it is a second spelling to bump, and the one that gets forgotten
          # puts this lane on a different toolchain from the format gate below —
          # which resolves go.mod's — so CI's two halves would disagree about which
          # gofmt is correct (iss-2609090951291799).
          go-version-file: go.mod

      # Enforce the format gate AGENTS.md documents, by INVOKING it rather than
      # restating it. The target resolves gofmt from the toolchain go.mod
      # declares, so this job and the developer's pre-push run are the same gate
      # judged by the same binary; the inline copy that used to live here read
      # whichever gofmt was on PATH, and diverged from the developer's the moment
      # their machine moved ahead of the pin (iss-2609081953452204). Formatting is
      # platform-independent, so run it once on the ubuntu leg to avoid duplicate
      # work; any file it lists needs `make fmt` and fails the job.
      - name: Format (gofmt)
        if: matrix.os == 'ubuntu-latest'
        run: make fmt-check

      # Unconditional on ubuntu, because tests assert against the live record;
      # the macos leg is the cross-platform second opinion a record change does
      # not need.
      - name: Build
        if: matrix.os == 'ubuntu-latest' || needs.changes.outputs.inert != 'true'
        run: go build ./...

      - name: Vet
        if: matrix.os == 'ubuntu-latest' || needs.changes.outputs.inert != 'true'
        run: go vet ./...

      - name: Test
        if: matrix.os == 'ubuntu-latest' || needs.changes.outputs.inert != 'true'
        run: go test ./...

      # Only a source change can introduce a data race, and the plain lane above
      # has already run the same tests over the record.
      - name: Test (race, internal)
        if: needs.changes.outputs.inert != 'true'
        run: go test -race ./internal/...

      # Drift gate for the .abcd/development design record. Blocking: a
      # blocker-severity finding exits non-zero and fails the job; warn-level
      # findings surface in the log only.
      #
      # `-agent-diff` additionally arms agent_contract's unbumped-edit check,
      # which needs a base revision to compare against.
      #
      # THE FALLBACK CHAIN, argued once here for the three range-scoped gates
      # that share it (this step, and the RS001/RS002 and DA001-DA004 steps in
      # the record-lint job). Each event this workflow triggers on names its base
      # in a different field, and the chain must cover all three or a gate goes
      # quiet on the event it does not cover — which is what happened to the
      # merge queue (iss-2609091258115663). `merge_group.base_sha` is the base
      # the queue entry was formed against, and reaching it matters more than the
      # other two rungs: the queue entry is the run that actually GATES the
      # merge, and the only run that sees the final base after a competing pull
      # request merged ahead of it, which is exactly the race a range check
      # exists to catch.
      #
      # The three fields are mutually exclusive — no event carries two — so the
      # order cannot change which value is picked on any real run, and it states
      # precedence rather than selecting between live values. It is written
      # weakest-last all the same: `github.event.before` is the ONLY rung that
      # can be present and wrong, because a force-push leaves it as the
      # all-zeroes placeholder or a rewritten sha that resolves to nothing. The
      # other two always name a real commit. A rung that can yield garbage never
      # pre-empts one that yields a fact, and the pull-request rung stays first
      # so the pull_request and push paths resolve exactly what they resolved
      # before — the change is purely additive.
      #
      # The base can therefore still be unusable, and this step handles that
      # rather than assuming it away: the guard falls back to the unarmed run
      # rather than failing, and every tree-shaped rule (the agent-prompt
      # frontmatter, the canary, the changelog entry) runs either way. The
      # fallback is loud: a downgrade nobody can see is a gate nobody knows is
      # off.
      - name: Record-lint (drift gate)
        if: matrix.os == 'ubuntu-latest'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] &&
            [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] &&
            git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            go run ./cmd/record-lint -agent-diff "${BASE_SHA}...HEAD"
          else
            echo "::warning::record-lint ran unarmed: no base commit for -agent-diff (BASE_SHA='${BASE_SHA:-}'), so agent_contract's unbumped-edit check did not run"
            go run ./cmd/record-lint
          fi

      # Promote-join drift gate (itd-4 AC3): both halves of every promote join
      # (`related_issues` on the intent, `related_intents` on the ledger record)
      # agree, no id dangles, a shipped intent's issue reached resolved/, and no
      # retired `promoted_to` / `promoted_from` key survives. `--strict` turns
      # the verb's warning into a failure; `make issue-drift` runs the same line.
      - name: Issue-drift (promote-join gate)
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/abcd intent audit --issue-drift --strict

      # Docs-currency gate (itd-60): the internal/core/lint engine over docs/ and
      # the repo root, driven via the `abcd docs lint` verb. Blocking — a doc-body
      # change-narration, broken relative link, or stray root markdown fails CI.
      - name: Docs-lint (currency gate)
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/abcd docs lint

      # Site-render gate (iss-2608241845109280): the site renders the record as
      # well as docs/, and the renderer refuses markdown outside its supported
      # subset. This lane always runs — the changes classifier never stands the
      # Linux leg down — so a records-only pull request is covered here, which
      # site-screenshots.yml's path filter does not cover. Build, then `site
      # check` the output: the publish gates (provenance, banned-tokens,
      # baseline, ...) are what release.yml's post-publish site job runs, so a
      # change that renders but trips a check gate must fail HERE, not after the
      # binaries ship. `site check` excludes docs/, so no mkdocs step is needed.
      - name: Site-render gate
        if: matrix.os == 'ubuntu-latest'
        run: |
          go run ./cmd/abcd site build --out "$RUNNER_TEMP/site-render-check"
          go run ./cmd/abcd site check --out "$RUNNER_TEMP/site-render-check"

  # Secrets never land in history: full-history scan on every push/PR. Run as a
  # pinned, checksum-verified CLI (no PR-comment / SARIF GitHub-API integration),
  # so it works on a private repo and survives the private->public flip. A
  # non-zero exit means gitleaks found a secret.
  gitleaks:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      # Hand-reviewed pin: an env-var version is invisible to dependabot's
      # github-actions ecosystem, so bumps are a deliberate maintainer act
      # (reviewed at each release cut), not an automated PR.
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLf -o "$base" "$url/$base"
          curl -sSLf -o checksums.txt "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $base\$" checksums.txt | sha256sum -c -
          tar -xzf "$base" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --redact --no-banner .

  # Audit the workflows themselves (pwn requests, template injection, cache
  # poisoning, unpinned uses). Run as a pinned CLI image (no SARIF upload to
  # code-scanning, which a private repo lacks). A non-zero exit means a finding.
  # Anything under .github/ is outside the inert allowlist, so the audit runs on
  # every change that could alter what it audits.
  zizmor:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.inert != 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows
        run: |
          # zizmor v1.26.1, pinned by digest (the registry publishes version
          # releases under :latest; a raw vX.Y.Z tag does not exist). A digest
          # inside a run: block is invisible to dependabot, so this pin too is
          # hand-reviewed at each release cut.
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" \
            ghcr.io/zizmorcore/zizmor@sha256:d1117e5dbd9ee4970644067b534ab6ab50371f3c6f7f4d05446eb603a6e78f48 \
            --persona regular /src

  # Deterministic gate for the .abcd/work/reviews/ charter (RD001-RD003). Needs
  # full history: RD002 (append-only) checks committed history for post-creation
  # edits, so fetch-depth: 0 (the default shallow checkout would miss them).
  # Stopgap until the RD codes land in internal/core/lint.
  record-lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reviews-charter gate can fail (cases)
        run: bash scripts/check-reviews-cases.sh

      - name: Reviews-charter discipline (RD001-RD003)
        run: bash scripts/check-reviews.sh

      # The cases run before the gate, deliberately. They prove the gate can
      # refuse a violating fixture; a gate whose rules have never been watched
      # fail is an enforcement claim with nothing behind it, and its green is
      # worse than no check at all (iss-2608230847432286).
      - name: Issue-resolution gate can fail (cases)
        run: bash scripts/check-issue-resolution-cases.sh

      # RS003 over the whole ledger: every resolved_by.commit stamp still
      # resolves and is still reachable. This is what notices the day a squash
      # or rebase merge rewrites a cited branch sha out of existence.
      - name: Issue-resolution stamps are reachable (RS003)
        run: bash scripts/check-issue-resolution.sh ledger HEAD

      # RS001/RS002/RS004/RS005 over the pull request's own range. RS005 is
      # RS001's twin for the intent store: a `Delivers: itd-N` trailer must see
      # that intent enter shipped/ in the same range. RS004 is the
      # commit half of the record-mention rule (iss-2609100507421759): a message
      # that names an iss-N declares `Resolves:` or `Refs:`. Its pull-request
      # half lives in attribution.yml, the one workflow that re-runs on an
      # `edited` title or body. On a push to main the
      # base is the previous tip, so the range is the merge that just landed; on
      # a merge-queue entry it is the base the entry was formed against, so the
      # range is the would-be merge. That last rung is the one this check needs
      # most and the one it lacked (iss-2609091258115663): a pull request whose
      # base was clean when it was armed could merge a resolution that a
      # competitor made terminal while it waited, because the only run that
      # could have seen the collision was the one where the check skipped
      # itself. The chain's order is argued at the record-lint step above.
      - name: Declared resolutions and deliveries move the record, mentions declare themselves (RS001/RS002/RS004/RS005)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "issue-resolution: no usable base ref for this event — range checks skipped, RS003 above still ran."
            exit 0
          fi
          bash scripts/check-issue-resolution.sh commits "$BASE_SHA" HEAD

      # Same shape again for the decisions ledger. The cases first, for the same
      # reason.
      - name: Decisions-append gate can fail (cases)
        run: bash scripts/check-decisions-append-cases.sh

      # DA001-DA004 over the pull request's own range: every line the range adds
      # to .abcd/work/DECISIONS.md landed after the last line its parent had
      # (DA001), no committed decision was removed against any parent (DA002),
      # no merge holds a line more times than its parents hold it between them
      # (DA003), and no commit introduced a NUL byte (DA004 — one NUL makes git
      # call the ledger binary, which would leave every rule above with no hunks
      # to read). Merges are checked, not skipped — a forged conflict resolution
      # appears in no single-parent commit — including the merge the QUEUE
      # itself makes, which only a merge_group run has in range at all. Same
      # chain as the two steps above, argued at the record-lint step.
      - name: Decisions ledger is append-only (DA001-DA004)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "decisions-append: no usable base ref for this event — the range check is skipped."
            exit 0
          fi
          bash scripts/check-decisions-append.sh commits "$BASE_SHA" HEAD

  # Self-discovering smoke harness (evals/): builds the binary, walks the Cobra
  # command tree in-process, and runs every command's --help plus the read-only
  # verbs against the built binary. Catches a command that compiles but panics when
  # actually invoked — which the unit lane (go test ./...) misses, because the
  # harness is behind the `smoke` build tag. What it walks is the command tree,
  # which only a source change moves. The read-only verbs also read the live
  # record, which an inert change can edit — a record-only panic surfaces one
  # hop later, on the push-to-main run (non-inert by classification) and again
  # in the release verify job, an accepted latency trade.
  smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.inert != 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Load check (skipped on CI, says why)
        run: go run ./cmd/abcd implement load --site eval-harness
      - name: Smoke every command
        run: make smoke

  # The cold-reading evals (evals/coldreading_*_test.go), on EVERY event. This job
  # carries no `inert` condition, deliberately, and it is the one lane in this
  # workflow besides the ubuntu unit lane that does not.
  #
  # The smoke job above stands down on a pull request confined to docs/,
  # .abcd/development/, .abcd/work/ and the root prose files. Those are precisely
  # the paths these evals read: a record-only change is the diff MOST able to
  # introduce warm content into material the assembler includes, so standing the
  # eval down there is anti-correlated with the risk — and a stood-down job still
  # reports its check context green, which is a green for work that did not
  # happen. The reasoning is the ubuntu unit lane's, one property further on: that
  # lane always runs because its tests read the live tree under the allowlist, and
  # this one always runs because its subject IS the allowlist.
  #
  # It runs the cold-reading evals ALONE, behind their own make target, so the
  # rest of the smoke harness keeps standing down: the command-tree walk is moved
  # only by a source change, and duplicating it here would pay for it on every
  # record-only pull request. The target selects by build tag, so a second
  # cold-reading eval joins this lane by carrying `//go:build smoke ||
  # coldreading` and needs no edit here.
  #
  # It IS a required status check — the ruleset mirror at
  # `.abcd/work/rulesets/main-protection.json` names its context, and
  # TestColdReadingEvalsIsARequiredStatusCheck holds the three parts of that
  # together (iss-2608311051046981). An always-run lane whose check cannot block
  # a merge reports a conclusion and stops nothing, which is the position the
  # eval exists to make impossible: a record-only pull request reaching main with
  # warm content in included material. Requiring it is safe precisely because it
  # stands down on no event — a `paths:` filter or an `inert` condition here
  # would leave the context permanently pending and wedge the queue.
  cold-reading-evals:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Load check (skipped on CI, says why)
        run: go run ./cmd/abcd implement load --site eval-harness
      - name: Falsify the cold-reading read-block
        run: make evals-cold-reading

  # The one supply-chain vector unreadable by eye: a dependency swap. Diffs the
  # PR's dependency changes against the advisory databases and fails on a known
  # vulnerability. pull_request only — the action reads the PR's diff, which a
  # merge_group or push event does not carry — and NOT a required check, so it
  # can never wedge the queue.
  dependency-review:
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Known-vulnerability scan over the module's own dependency graph, on every
  # event (unlike dependency-review it needs no PR diff). Pinned like every
  # other tool this workflow runs.
  govulncheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.inert != 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
