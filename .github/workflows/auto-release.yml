name: auto-release

# On every push to the default branch, tag-and-release the NEWEST dated
# CHANGELOG version when it has no git tag yet — WITHOUT a PAT. A tag pushed with
# the built-in GITHUB_TOKEN deliberately does NOT re-trigger release.yml's
# tag-push event, so this workflow instead creates the tag and then invokes
# release.yml directly as a reusable workflow (the `release` job below). That
# keeps the whole publish path inside GitHub's own token model — no personal
# access token, no elevated secret.
#
# Only the NEWEST dated version is ever tagged: older CHANGELOG versions are left
# alone, because tagging them at the current HEAD would mis-point an immutable
# tag at the wrong code. Idempotent: when the newest version is already tagged AND
# its GitHub Release exists, `detect` reports need_tag=need_release=false and
# nothing runs, so an ordinary (non-release) push to main does nothing. If the tag
# exists but its Release is MISSING (e.g. a transient publish failure), `detect`
# sets need_release=true and re-invokes `release` ALONE — built from the tagged
# commit (release_ref), never the moved-on HEAD — so a flaky publish never
# permanently wedges the version.
on:
  push:
    branches: [main]

# Serialise: never let two auto-release runs race to create the same tag, and
# never cancel one mid-flight — a half-created tag or release is worse than a
# queued one.
concurrency:
  group: auto-release
  cancel-in-progress: false

# Floor for the workflow: read-only. Each job elevates itself to exactly the
# scopes it needs, and no more.
permissions:
  contents: read

jobs:
  # Decide whether the newest dated CHANGELOG version still needs a tag. Pure
  # read: no writes, no pushes, contents: read only.
  detect:
    runs-on: ubuntu-latest
    # Room for the pre-tag archive proof below, which compiles the binary.
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.detect.outputs.version }}
      need_tag: ${{ steps.detect.outputs.need_tag }}
      need_release: ${{ steps.detect.outputs.need_release }}
      release_ref: ${{ steps.detect.outputs.release_ref }}
    steps:
      - name: Check out the pushed commit (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 pulls every tag so the existence check below is
          # authoritative; a shallow clone would omit tags and mis-report.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect the newest CHANGELOG version needing a tag or a re-release
        id: detect
        # No ${{ }} interpolation in this run script (injection-safe, zizmor): it
        # reads CHANGELOG.md from the checkout, queries git + gh, and writes only
        # to $GITHUB_OUTPUT. GH_TOKEN arrives via env (not inline), so `gh release
        # view` can read the repo's releases under the floor `contents: read`.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The first heading of the form "## [X.Y.Z] - <date>" (or the historical
          # "## [vX.Y.Z] - <date>" style) is the newest
          # dated release. Requiring the " - " date separator skips the
          # "## [Unreleased]" heading, which carries no date.
          version="$(grep -m1 -E '^## \[v?[0-9]+\.[0-9]+\.[0-9]+\] - ' CHANGELOG.md \
            | sed -E 's/^## \[v?([0-9]+\.[0-9]+\.[0-9]+)\] - .*/\1/' || true)"
          if [ -z "$version" ]; then
            echo "No dated CHANGELOG version found; nothing to release."
            echo "need_tag=false" >> "$GITHUB_OUTPUT"
            echo "need_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            # The tag already exists, so it is NEVER moved (immutable). Re-release
            # ONLY when its GitHub Release is missing: a transient publish failure
            # must not permanently wedge the version. Build the re-release FROM the
            # tagged commit, not the current (moved-on) main HEAD — resolve the tag
            # to its immutable commit SHA and hand it to release.yml as `ref`.
            echo "need_tag=false" >> "$GITHUB_OUTPUT"
            # Deliberate fail-open: ANY non-zero from `gh release view` (a true 404
            # or a transient rate-limit/auth blip) counts as "Release missing" and
            # re-releases. Safe — `gh release create` (release.yml) has no --clobber,
            # so a false positive just errors on the existing release and nothing is
            # overwritten: one red run, no data loss. Parsing the error to isolate a
            # real 404 was rejected — it would hinge on gh's wording and could
            # misclassify a genuine missing-Release, re-wedging the very failure
            # this heals.
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is tagged and released; nothing to do."
              echo "need_release=false" >> "$GITHUB_OUTPUT"
            else
              commit="$(git rev-parse --verify "$tag^{commit}")"
              echo "$tag is tagged but has NO GitHub Release; re-releasing from $commit."
              echo "need_release=true" >> "$GITHUB_OUTPUT"
              echo "release_ref=$commit" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "$tag has no git tag; will tag and release at github.sha."
            echo "need_tag=true" >> "$GITHUB_OUTPUT"
            echo "need_release=true" >> "$GITHUB_OUTPUT"
          fi

      # --- The pinned plugin archive, proved BEFORE the tag -------------------
      # release.yml's verify job proves the committed pin reproduces, but only
      # once the tag exists, and a tag is never moved: a refusal there consumes
      # the version. The pushed commit is not always the one the ship rendered —
      # a merge-queue batch carries the ship together with any other queued pull
      # request, and one that touches the payload re-renders to another digest.
      # So the same proof runs here, on the exact commit the tag job would tag,
      # and a refusal fails detect, which the tag job needs: nothing is tagged,
      # the version stays free, and the next push to the default branch retries.
      # Only a version about to be tagged is proved — between releases the
      # default branch pins the last release's archive, which its moved-on tree
      # no longer reproduces. TAG arrives through env (injection-safe).
      - name: Set up Go
        if: steps.detect.outputs.need_tag == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # cache: false — module caching in a release-triggering workflow is a
          # cache-poisoning vector (zizmor).
          cache: false

      - name: Plugin archive reproduces the committed pin, before the tag (fail-closed)
        if: steps.detect.outputs.need_tag == 'true'
        env:
          TAG: v${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/plugin-archive"
          mkdir -p "$out"
          # --repository binds the pin's address to the repository this workflow
          # releases from: the address derives from plugin.json's repository,
          # which a rename, a transfer or a fork leaves naming another
          # repository, and --verify alone passes on a pin every install 404s on.
          go run ./cmd/abcd launch archive --out "$out" --tag "${TAG}" --verify --repository "${GITHUB_REPOSITORY}"

  # Create and push the annotated tag with the GITHUB_TOKEN. This is the ONLY
  # push this automation makes, and it targets a NEW tag ref only — never a
  # branch. A GITHUB_TOKEN-pushed tag raises no tag-push event, which is why the
  # release below invokes release.yml explicitly rather than relying on the tag.
  tag:
    needs: detect
    if: needs.detect.outputs.need_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # push the new tag ref
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha = this main push's HEAD, the immutable commit to tag.
          ref: ${{ github.sha }}
          # persist-credentials: true is REQUIRED here so `git push` below
          # authenticates as the GITHUB_TOKEN. Scoped to this single tag-creating
          # job whose only step pushes one new tag ref; no other step runs, so
          # the persisted credential is never exposed to untrusted input.
          persist-credentials: true

      - name: Create and push the annotated tag at the released commit
        # Values arrive via env (no ${{ }} inside the script): injection-safe.
        env:
          TAG: v${{ needs.detect.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Annotated tag at github.sha — the exact commit this push built and the
          # commit release.yml will check out (github.sha) and ship.
          git tag -a "$TAG" -m "abcd $TAG" "$COMMIT"
          git push origin "refs/tags/$TAG"

  # Cut the release by calling release.yml as a reusable workflow. Because it is
  # CALLED (not triggered by the tag push), github.sha inside release.yml is this
  # run's HEAD = the commit just tagged, so both of release.yml's jobs check out
  # and ship exactly that commit — the same anti-tag-move property the tag-push
  # entry point has.
  # A called workflow is capped by the caller's grants, and that cap is
  # transitive: release.yml in turn calls site.yml (adr-48), so this job hands
  # down every scope BOTH workflows' jobs need (contents/id-token/attestations:
  # write). The three happen to be the same set, so the site deploy widens
  # nothing here.
  release:
    needs: [detect, tag]
    # Run when a release is needed AND the tag is in place — either the tag job
    # just created it (success) or it already existed and was skipped. !cancelled()
    # is required because `tag` is skipped on the re-release path; a bare success()
    # would skip this job too. !cancelled() still fires on a SKIPPED `tag` but NOT
    # on a cancelled run, so a manual cancel can never publish a half-finished
    # state. A FAILED tag job (result neither success nor skipped) blocks the
    # release, so a half-made tag never publishes.
    if: >-
      !cancelled()
      && needs.detect.outputs.need_release == 'true'
      && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    permissions:
      contents: write        # release.yml: create the Release + verify the tag; site.yml: attach site.tar.gz
      id-token: write        # release.yml + site.yml: OIDC for build-provenance attestation
      attestations: write    # release.yml: publish + read back the attestations; site.yml: attest site.tar.gz
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.detect.outputs.version }}
      # Empty on the fresh-tag path → release.yml falls back to github.sha (the
      # commit just tagged). The resolved tagged-commit SHA on the re-release
      # path, so the Release is built from the tag, not a newer main HEAD.
      ref: ${{ needs.detect.outputs.release_ref }}
    # Without this the whole chain runs with an EMPTY secrets context, and the
    # deploy at the end of it fails on a credential that was never conveyed
    # (iss-2608231912566984). A called workflow's `secrets` context is ONLY what
    # its caller passes: a job inside it that declares `environment:` gets the
    # environment applied — a deployment record is even created — but resolves
    # none of that environment's secrets unless `inherit` unlocked the context
    # first. Necessary at EVERY level, so this line and release.yml's call to
    # site.yml are one mechanism, not two.
    #
    # Measured rather than reasoned, on a canary environment secret through this
    # exact two-level shape: top-level job with the environment SET; nested twice
    # with no secrets line EMPTY; nested twice with inherit at this call SET.
    # TestReleaseChainPassesSecretsAtEveryLevel (internal/core/site) pins
    # this line and the three others like it.
    #
    # The blast radius is what inherit conveys, which is the caller's own set —
    # and this repository holds no repository-scoped and no organisation secret
    # of its own.
    # Every credential is environment-scoped, gated by the callee's own jobs.
    secrets: inherit # zizmor: ignore[secrets-inherit]
