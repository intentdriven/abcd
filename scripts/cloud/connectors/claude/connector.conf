# The first host's connector (spc-2610120941441282, itd-2610120738075547
# decision 1): its hosted cloud sessions. Everything that names this host lives
# in this directory, and .claude/settings.json, which the host reads at that
# fixed path. Read as key=value data by scripts/cloud/connector.sh, never
# sourced; the keys are documented there.
#
# wip_prefix sits inside the host's own branch namespace, in case its forge
# proxy admits only that, and is narrow enough that a person's own hand-pushed
# claude/ branches still need a preflight receipt (decision 3,
# adr-2610120937435856).
name=claude
wip_prefix=claude/abcd-wip/
is_remote=is-remote.sh
