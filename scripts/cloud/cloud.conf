# Host-agnostic settings for the cloud-session scripts (spc-2610120941441282).
# Read as key=value data, never sourced. Nothing here names a host: a host's own
# settings live in its connector under scripts/cloud/connectors/.
#
# tracking_issue: the number of the one public issue a session comments on when
# its report cannot be pushed (itd-2610120738075547 decision 4). Empty until the
# person creates that issue (the spec's step 1); while it is empty the
# hand-back's fallback refuses by name ("no tracking issue configured") and
# prints the report, and never posts anywhere else.
tracking_issue=
# report_dir: where a session's report file is committed on its
# work-in-progress branch, one <item-id>.md per item. The required check refuses
# any change that adds a path under it to the default branch.
report_dir=.abcd/work/cloud-reports
